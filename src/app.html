<!doctype html>
<html lang="en" data-theme="cerberus">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Anti-FOUC (gw-ui-redesign.5): apply the persisted theme before first paint
		     so the page never flashes the wrong scheme. Mirrors theme.svelte.ts: a
		     stored 'light'/'dark' forces the scheme; anything else (incl. 'system')
		     leaves it to the stylesheet's prefers-color-scheme rule. -->
		<script>
			(function () {
				try {
					var m = localStorage.getItem('gw-theme');
					if (m === 'light' || m === 'dark') document.documentElement.style.colorScheme = m;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
